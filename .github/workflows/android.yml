name: Build Rakib AI Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Dependencies and Build
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
          
          # Fix Java 21 bytecode crash by forcing Java 17 compatible bouncycastle version
          cat << 'EOF' >> build.gradle.kts
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force("org.bouncycastle:bcprov-jdk18on:1.78.1")
                      force("org.bouncycastle:bcpkix-jdk18on:1.78.1")
                      force("org.bouncycastle:bcutil-jdk18on:1.78.1")
                  }
              }
          }
          EOF

          ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rakib-AI-Aim-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          
