name: Build Rakib AI Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Upgrade AGP and Build APK
        run: |
          # AGP 8.3.2 এ আপডেট করা (যা জাভা ২১ ক্লাস হ্যান্ডেল করতে পারে)
          sed -i 's/com.android.application" version ".*"/com.android.application" version "8.3.2"/' build.gradle.kts || true
          sed -i 's/com.android.library" version ".*"/com.android.library" version "8.3.2"/' build.gradle.kts || true
          sed -i 's/com.android.tools.build:gradle:.*"/com.android.tools.build:gradle:8.3.2"/' build.gradle.kts || true

          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

          ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rakib-AI-Aim-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          
