name: Build Rakib AI Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix BouncyCastle & Build APK
        run: |
          gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew

          # Download stable Java 17 compatible JAR
          mkdir -p fix_jar
          curl -sL https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/1.78.1/bcprov-jdk18on-1.78.1.jar -o fix_jar/bcprov-fixed.jar

          # Fetch dependencies first
          ./gradlew dependencies || true

          # Replace all broken 1.79 JARs with 1.78.1 in Gradle cache
          find /home/runner/.gradle/caches/ -name "*bcprov-jdk18on-1.79.jar*" -exec cp fix_jar/bcprov-fixed.jar {} \; 2>/dev/null || true

          # Build APK
          ./gradlew assembleDebug --no-daemon --stacktrace -x lint -x test

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rakib-AI-Aim-Pro-APK
          path: app/build/outputs/apk/debug/*.apk
          
