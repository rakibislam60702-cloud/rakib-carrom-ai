name: Build Rakib AI Aim APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Generate Wrapper & Build APK
      run: |
        # ডিফল্ট অ্যান্ড্রয়েড ডিবাগ কি তৈরি করা (যদি না থাকে)
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p /home/runner/.android/
        cp debug.keystore /home/runner/.android/debug.keystore
        
        gradle wrapper --gradle-version 9.3.1
        chmod +x gradlew
        ./gradlew assembleDebug -x validateSigningDebug --no-daemon --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Rakib-AI-ultra-APK
        path: app/build/outputs/apk/debug/*.apk
        
